services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-taabeer}
      MARIADB_USER: ${WORDPRESS_DB_USER:-taabeer}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-taabeer-local}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-taabeer-root-local}
    volumes:
      - taabeer_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-taabeer}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-taabeer}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-taabeer-local}
      WORDPRESS_DEBUG: "1"
    volumes:
      - taabeer_wordpress:/var/www/html
      - ./wordpress/wp-content/themes/taabeer:/var/www/html/wp-content/themes/taabeer
      - ./wordpress/wp-content/plugins/taabeer-deployment-manager:/var/www/html/wp-content/plugins/taabeer-deployment-manager
      - ./wordpress/.htaccess:/var/www/html/.htaccess

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    entrypoint: wp
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-taabeer}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-taabeer}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-taabeer-local}
    volumes:
      - taabeer_wordpress:/var/www/html
      - ./wordpress/wp-content/themes/taabeer:/var/www/html/wp-content/themes/taabeer
      - ./wordpress/wp-content/plugins/taabeer-deployment-manager:/var/www/html/wp-content/plugins/taabeer-deployment-manager
      - ./wordpress/.htaccess:/var/www/html/.htaccess

volumes:
  taabeer_database:
  taabeer_wordpress:
