name: Publish TAABEER client preview

on:
  push:
    branches: [main]
    paths:
      - "wordpress/wp-content/themes/taabeer/**"
      - "tools/package_theme.py"
      - "tools/generate_update_manifest.py"
      - ".github/workflows/taabeer-client-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taabeer-client-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify theme package
        id: package
        shell: bash
        run: |
          package="$(python tools/package_theme.py)"
          python tools/verify_package.py "$package"
          python tools/generate_update_manifest.py "$package" --commit "$GITHUB_SHA" --notes "TAABEER client preview from main (${GITHUB_SHA::12})."
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Create release channel when missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view client-preview >/dev/null 2>&1; then
            gh release create client-preview --prerelease --target "$GITHUB_SHA" --title "TAABEER Client Preview" --notes "Managed theme releases for the connected WordPress website."
          fi

      - name: Publish verified update assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload client-preview "${{ steps.package.outputs.path }}" artifacts/taabeer-update.json --clobber

